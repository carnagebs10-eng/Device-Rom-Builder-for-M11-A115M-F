name: Build Samsung M11 Custom ROM

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct Link to Samsung Stock Firmware AP (.tar.md5 / .tar / .zip / .7z)'
        required: true
        type: string
      gsi_url:
        description: 'Direct Link to GSI Image (.img, .xz, .zip, .7z)'
        required: true
        type: string
      gsi_name:
        description: 'GSI Name / Label (e.g., PixelOS_A14_System)'
        required: true
        default: 'GSI_System'
        type: string
      rom_name:
        description: 'Output ROM Name (e.g., PixelOS_A14_arm64-M11)'
        required: true
        default: 'PixelOS_A14_arm64-M11'
        type: string
      include_magisk:
        description: 'Include Magisk (Root)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Build Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            wget curl ca-certificates xz-utils zip p7zip-full lz4 \
            android-sdk-libsparse-utils python3 python3-pip \
            build-essential cmake libssl-dev zlib1g-dev coreutils
          sudo apt-get install -y android-tools-bin || sudo apt-get install -y android-tools-fs-utils || true

      - name: Ensure Android Partition Tools (lpmake / lpunpack)
        run: |
          mkdir -p bin
          if ! command -v lpmake &> /dev/null; then
            sudo apt-get install -y android-sdk-platform-tools-common || true
          fi
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Download & Extract Raw Inputs with Retry Validation
        run: |
          mkdir -p workspace/downloads
          cd workspace/downloads
          
          echo "=== Downloading Stock Firmware AP File ==="
          wget --retry-connrefused --waitretry=3 --tries=5 -O stock_ap_raw "${{ github.event.inputs.firmware_url }}" || { echo "Firmware download failed!"; exit 1; }
          
          if 7z t stock_ap_raw >/dev/null 2>&1; then
            echo "Extracting 7z/ZIP archive..."
            7z x -y stock_ap_raw -o.
          elif tar -tf stock_ap_raw >/dev/null 2>&1; then
            echo "Extracting TAR archive..."
            tar -xf stock_ap_raw
          else
            echo "Unknown or corrupt AP format!"
            exit 1
          fi

          echo "=== Downloading GSI Image: ${{ github.event.inputs.gsi_name }} ==="
          wget --retry-connrefused --waitretry=3 --tries=5 -O base_gsi_raw "${{ github.event.inputs.gsi_url }}" || { echo "GSI download failed!"; exit 1; }
          
          if [[ "${{ github.event.inputs.gsi_url }}" == *.xz ]] || 7z t base_gsi_raw | grep -i xz >/dev/null 2>&1; then
            mv base_gsi_raw base_gsi.img.xz
            unxz -f base_gsi.img.xz
          elif 7z t base_gsi_raw >/dev/null 2>&1; then
            7z x -y base_gsi_raw -o.
            mv *.img base_gsi.img 2>/dev/null || true
          else
            mv base_gsi_raw base_gsi.img
          fi

          if [ ! -s base_gsi.img ]; then
            echo "Error: Extracted base_gsi.img is empty or missing!"
            exit 1
          fi

      - name: Download Magisk v30.7 Payload
        if: ${{ inputs.include_magisk }}
        run: |
          mkdir -p tools/magisk
          echo "=== Fetching Magisk v30.7 Archive ==="
          wget --retry-connrefused --waitretry=3 --tries=5 -O tools/magisk/magisk.apk "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          
          cd tools/magisk
          7z x -y magisk.apk
          cd ../..

      - name: Execute Build Pipeline
        run: |
          chmod +x ./scripts/build_m11.sh
          ./scripts/build_m11.sh "${{ github.event.inputs.rom_name }}" "${{ github.event.inputs.include_magisk }}" "${{ github.event.inputs.gsi_name }}"

      - name: Upload Flashable ZIP Package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rom_name }}
          path: workspace/output/*.zip
