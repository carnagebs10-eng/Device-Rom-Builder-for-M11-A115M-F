name: Universal Self-Detecting Samsung ROM Compiler

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: 'Direct Download Link to Custom GSI (.img / .xz / .7z)'
        required: true
        default: ''
      samsung_firmware_url:
        description: 'Direct Link to Official Samsung Stock Firmware (.zip)'
        required: true
        default: ''
      include_gapps:
        description: 'Tick to automatically download and inject Google Apps (GApps)'
        required: false
        type: boolean
        default: false
      include_magisk:
        description: 'Tick to inject Magisk Root Execution binaries automatically'
        required: false
        type: boolean
        default: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Repository
      uses: actions/checkout@v4

    - name: Deploy Parallel Toolchain Utilities
      run: |
        sudo apt-get update
        sudo apt-get install -y aria2 pixz p7zip-full pigz android-sdk-libsparse-utils zip jq

    - name: Allocate Workspace Blocks
      run: |
        mkdir -p workspace/out_zip
        mkdir -p workspace/stock_extracted
        mkdir -p workspace/extracted_partitions
        mkdir -p workspace/gapps_temp

    - name: Parallel Download Sourcing Engine
      run: |
        cd workspace
        aria2c -x 16 -s 16 -j 2 \
          "${{ github.event.inputs.gsi_url }}" \
          "${{ github.event.inputs.samsung_firmware_url }}"
        
        GSI_FILE=$(basename "${{ github.event.inputs.gsi_url }}")
        FW_FILE=$(basename "${{ github.event.inputs.samsung_firmware_url }}")
        
        if [[ "$GSI_FILE" == *.xz ]]; then
            pixz -d "$GSI_FILE" system.img
        elif [[ "$GSI_FILE" == *.7z ]]; then
            7z x "$GSI_FILE" -o.
            mv *.img system.img
        else
            mv "$GSI_FILE" system.img
        fi
        
        echo "FINAL_GSI_URL=${{ github.event.inputs.gsi_url }}" >> $GITHUB_ENV
        echo "FW_NAME=$FW_FILE" >> $GITHUB_ENV

    - name: Extract Samsung AP Firmware Layers
      run: |
        cd workspace
        7z x "$FW_NAME" -ostock_extracted/
        
        cd stock_extracted
        AP_FILE=$(ls AP_*.tar.md5 2>/dev/null || ls AP_*.tar 2>/dev/null)
        
        if [ -n "$AP_FILE" ]; then
            mv "$AP_FILE" AP_firmware.tar
            tar -xf AP_firmware.tar boot.img super.img 2>/dev/null || tar -xf AP_firmware.tar
            
            mv boot.img ../boot 2>/dev/null || touch ../boot
            mv super.img ../super_stock.img
        else
            echo "[!] ERROR: AP tar package file was not found inside the firmware zip!"
            exit 1
        fi

    - name: Standalone Android Binaries Injection
      run: |
        cd workspace
        aria2c -x 8 -s 8 https://github.com -O lpmake
        wget -q https://github.com -O lpunpack
        chmod +x lpmake lpunpack

    - name: Unpack Super and Deep-Analyze Architecture
      run: |
        cd workspace
        simg2img super_stock.img super_raw.img 2>/dev/null || mv super_stock.img super_raw.img
        ./lpunpack super_raw.img extracted_partitions/
        
        SUPER_SIZE=$(stat -c%s super_raw.img)
        echo "DETECTED_SUPER_SIZE=$SUPER_SIZE" >> $GITHUB_ENV
        
        echo "[-] Probing extracted vendor driver profiles for hardware configuration tracking..."
        VENDOR_ABI=$(strings extracted_partitions/vendor.img | grep -m 1 "ro.vendor.product.cpu.abi=" | cut -d'=' -f2 || strings extracted_partitions/vendor.img | grep -m 1 "ro.product.cpu.abi=" | cut -d'=' -f2)
        
        if [ -z "$VENDOR_ABI" ]; then VENDOR_ABI="arm64-v8a"; fi
        echo "[+] Factory firmware hardware platform detected as: $VENDOR_ABI"
        
        TARGET_ARCH="arm64"
        IS_BINDER32="false"
        
        if [[ "$VENDOR_ABI" == *v7* || "$VENDOR_ABI" == *arm32* || "${{ github.event.inputs.samsung_firmware_url }}" == *M115* || "${{ github.event.inputs.samsung_firmware_url }}" == *A115* ]]; then
            TARGET_ARCH="a64-binder32"
            IS_BINDER32="true"
        fi
        
        echo "DETECTED_ARCH=$TARGET_ARCH" >> $GITHUB_ENV
        echo "IS_BINDER32=$IS_BINDER32" >> $GITHUB_ENV
        
        rm -f extracted_partitions/system.img
        mv system.img extracted_partitions/system.img

    - name: Dynamic Inject Optional Addon Sub-Modules (GApps & Magisk)
      run: |
        cd workspace
        
        # 1. Evaluate the GApps Injection Checkbox Flag
        if [ "${{ github.event.inputs.include_gapps }}" = "true" ]; then
            echo "[+] GApps option checked! Pulling optimized deployment payload down..."
            # Pulling a light microG/GApps package frame to inject directly over systemic app trees
            aria2c -x 12 -s 12 "https://github.com" -O gapps.zip 2>/dev/null || true
            if [ -f "gapps.zip" ]; then
                mkdir -p out_zip/META-INF/com/google/android/addons/
                mv gapps.zip out_zip/META-INF/com/google/android/addons/gapps.zip
                echo "[+] GApps package staged neatly inside structural flash layer."
            fi
        fi
        
        # 2. Evaluate the Magisk Injection Checkbox Flag
        if [ "${{ github.event.inputs.include_magisk }}" = "true" ]; then
            echo "[+] Magisk options checked! Downloading official tracking binary logs..."
            # Pull the official verified universal root binary installer payload down
            aria2c -x 8 -s 8 "https://github.com" -O magisk.apk
            if [ -f "magisk.apk" ]; then
                mkdir -p out_zip/META-INF/com/google/android/magisk/
                # Rename to standard zip module format so custom recovery script loops read it smoothly
                mv magisk.apk out_zip/META-INF/com/google/android/magisk/magisk.zip
                echo "[+] Magisk injection payload armed inside recovery installation matrix blocks."
            fi
        fi

    - name: Low-RAM Execution Guard and GMS Optimization
      run: |
        cd workspace
        # Robust Safeguard Check: If our scanner locked the target as a 32-bit Binder phone (like M11),
        # we execute memory footprint optimization routines to ensure it doesn't throttle background RAM.
        if [ "${{ env.IS_BINDER32 }}" = "true" ]; then
            echo "[-] Running system tree RAM management modifications for low-resource hardware..."
            # If the user chose to include heavy GApps on a 32-bit device, we alter configurations 
            # to forcefully throttle background sync execution cycles upon boot.
            echo "ro.config.low_ram=true" >> out_zip/META-INF/zbin/configs/file_types.config
            echo "dalvik.vm.heapstartsize=8m" >> out_zip/META-INF/zbin/configs/file_types.config
            echo "dalvik.vm.heapgrowthlimit=128m" >> out_zip/META-INF/zbin/configs/file_types.config
            echo "[+] Baseline memory profiles hardened successfully."
        fi

    - name: Universal Dynamic Super Partition Reconstruction
      run: |
        cd workspace
        cd extracted_partitions
        
        LP_CMD="../lpmake --metadata-size 65536 --super-name super --metadata-slots 2 --device super:${{ env.DETECTED_SUPER_SIZE }} --sparse --output ../super.new.img"
        GROUP_SIZE=$((${{ env.DETECTED_SUPER_SIZE }} - 2097152))
        LP_CMD="$LP_CMD --group main:$GROUP_SIZE"
        
        for part_file in *.img; do
            part_name="${part_file%.img}"
            LP_CMD="$LP_CMD --partition ${part_name}:readonly:0:main --image ${part_name}=./${part_file}"
        done
        
        echo "Executing Universal Build Map..."
        eval $LP_CMD

    - name: Structural Text Matching Configuration
      run: |
        cp -r template/* workspace/out_zip/ 2>/dev/null || true
        GSI_URL_LOWER=$(echo "${{ env.FINAL_GSI_URL }}" | tr '[:upper:]' '[:lower:]')
        FILENAME_EXT=$(basename "${{ env.FINAL_GSI_URL }}" | cut -d'?' -f1)
        
        ROM_FLAVOR="Custom_GSI"
        if [[ "$GSI_URL_LOWER" == *pixelos* ]]; then ROM_FLAVOR="PixelOS"; fi
        if [[ "$GSI_URL_LOWER" == *risingos* ]]; then ROM_FLAVOR="RisingOS_Revived"; fi
        if [[ "$GSI_URL_LOWER" == *lineage* ]]; then ROM_FLAVOR="LineageOS"; fi
        
        ANDROID_VER="A14"
        if [[ "$GSI_URL_LOWER" == *a15* || "$GSI_URL_LOWER" == *v15* || "$GSI_URL_LOWER" == *android15* || "$GSI_URL_LOWER" == *7\.1* ]]; then ANDROID_VER="A15"; fi
        
        echo "ROM_NAME=${ROM_FLAVOR}_${ANDROID_VER}_${{ env.DETECTED_ARCH }}" > workspace/out_zip/META-INF/addons/info
        echo "SOURCE_LINK=${{ env.FINAL_GSI_URL }}" >> workspace/out_zip/META-INF/addons/info
        echo "HARDWARE_ABI_RESTRICTION=${{ env.DETECTED_ARCH }}" >> workspace/out_zip/META-INF/addons/info
        echo "${ROM_FLAVOR} built on $(date +'%Y%m%d')" > workspace/out_zip/META-INF/zbin/version
        
        echo "gsi_source_file_name_target=$FILENAME_EXT" >> workspace/out_zip/META-INF/zbin/configs/file_types.config
        echo "detected_device_binder32_lock=${{ env.IS_BINDER32 }}" >> workspace/out_zip/META-INF/zbin/configs/file_types.config
        echo "target_android_version=$ANDROID_VER" >> workspace/out_zip/META-INF/zbin/configs/units.config
        echo "active_architecture_profile=${{ env.DETECTED_ARCH }}" >> workspace/out_zip/META-INF/zbin/configs/units.config

    - name: Compress Nested extra.zip Addon Package
      run: |
        cd workspace/out_zip/META-INF/addons/
        if [ -d "extra_source" ]; then
            cd extra_source
            zip -r9 ../extra.zip .
            cd ..
            rm -rf extra_source
        fi

    - name: Multi-Threaded Heavy Compression Assemble
      run: |
